services:
  ocs2:
    image: aclm:noetic
    build:
      context: .
      args:
        ROS_BASE_IMAGE: "${ROS_BASE_IMAGE:-docker.m.daocloud.io/osrf/ros:noetic-desktop-full}"
        CATKIN_JOBS: "2"
        USER_UID: "${HOST_UID:-1000}"
        USER_GID: "${HOST_GID:-1000}"
    network_mode: host
    ipc: host
    environment:
      DISPLAY: "${DISPLAY}"
      QT_X11_NO_MITSHM: "1"
      LIBGL_ALWAYS_SOFTWARE: "${LIBGL_ALWAYS_SOFTWARE:-0}"
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    stdin_open: true
    tty: true
